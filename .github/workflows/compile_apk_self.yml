name: build Android for avkiller

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: 'release tags(Default: v1.18.0)'
        required: true
        default: 'v1.18.0'

env:
  FLUTTER_VERSION: "3.41.9"
  RUST_VERSION: "1.84.1"
  APK_BUILD_DIR: "/tmp/build"

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_apk:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      TAG_NAME: ${{ inputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Remove proprietary dependencies
        run: sh support/scripts/remove_proprietary_dependencies.sh

      - name: Copy files to env.APK_BUILD_DIR
        run: |
          mkdir -p $APK_BUILD_DIR
          cp -r . $APK_BUILD_DIR

      - name: Decode key.properties file
        working-directory: ${{ env.APK_BUILD_DIR }}
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          echo $ENCODED_STRING | base64 -di > app/android/key.properties
          echo "" >> app/android/key.properties
          echo "storeFile=../../../secrets/android-keystore.jks" >> app/android/key.properties

          echo "key.properties line count: $(wc -l < app/android/key.properties)"

      - name: Decode android-keystore.jks file
        working-directory: ${{ env.APK_BUILD_DIR }}
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEY_STORE }}
        run: |
          mkdir secrets 
          echo $ENCODED_STRING | base64 -di > secrets/android-keystore.jks

          echo "--- 当前工作目录 (PWD) ---"
          pwd
          ls -al

          # echo "--- 检查目标目录是否存在 ---"
          # if [ -d "android/app/secrets" ]; then
          #     echo "✅ 目录 android/app/secrets 存在。"
          #     ls -l android/app/secrets
          # else
          #     echo "❌ 目录不存在。实际 android/app/ 下的内容有："
          #     ls -F android/app/
          # fi
          

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          #override: ${{ env.RUST_VERSION }}

      - name: Dependencies
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: |
          echo "--- 当前工作目录 (PWD) ---"
          pwd
          ls -al
          flutter build apk --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/localsend-v8a-release.apk 

      # - name: Upload APK
      #   uses: actions/upload-artifact@v6
      #   with:
      #     name: apk-result
      #     path: |
      #       ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
      #       ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      #       ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: |
            ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/localsend-v8a-release.apk
          draft: true
          target_commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN}}

