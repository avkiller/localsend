name: Release Manager for avkiller

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: 'Release Tag (e.g. v1.18.0)'
        required: true
        default: 'v1.18.0'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # 自动查询并下载 APK 和 Win 的最新成功构建
      - name: Download Artifacts from both Workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_NO_TLS_VERIFY: "1"
        run: |
          mkdir -p assets

          echo "🔍 正在寻找最新的 Android 构建产物..."
          APK_RUN_ID=$(gh run list --workflow "build Android for avkiller" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$APK_RUN_ID" ]; then
            echo "发现 Android Run ID: $APK_RUN_ID，开始下载..."
            gh run download $APK_RUN_ID --dir assets/android
          else
            echo "⚠️ 未找到成功的 Android 构建记录"
          fi

          echo "🔍 正在寻找最新的 Windows 构建产物..."
          WIN_RUN_ID=$(gh run list --workflow "build with windows for avkiller" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$WIN_RUN_ID" ]; then
            echo "发现 Windows Run ID: $WIN_RUN_ID，开始下载..."
            gh run download $WIN_RUN_ID --dir assets/windows
          else
            echo "⚠️ 未找到成功的 Windows 构建记录"
          fi

      - name: Check downloaded files
        run: ls -R assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          draft: true
          overwrite_files: true
          files: |
            assets/**/*.apk
            assets/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}