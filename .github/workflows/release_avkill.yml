name: Release Manager for avkiller

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: 'Release Tag (e.g. v1.18.0)'
        required: true
        default: 'v1.18.0'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

       # 下载 Windows 构建产物
      - name: Download Windows artifact
        uses: dawidd6/action-download-artifact@21
        with:
          workflow: compile_win.yml
          workflow_conclusion: success
          name: windows-zip-x86-64-result
          path: assets/windows/
          # 如果找不到产物，不要中断流程（可选）
          if_no_artifact_found: false
      
      # 下载 APK 构建产物
      - name: Download APK artifact
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: compile_apk_self.yml
          workflow_conclusion: success
          name: apk-result
          path: assets/apk/
          if_no_artifact_found: false
      
      # 查看下载的文件（调试用）
      - name: List downloaded files
        run: |
          echo "📦 下载的产物："
          find assets/ -type f -ls
          echo ""
          echo "📊 文件列表："
          ls -laR assets/ || true
      - name: Check downloaded files
        run: ls -R assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          draft: true
          overwrite_files: true
          files: |
            assets/**/*.apk
            assets/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}