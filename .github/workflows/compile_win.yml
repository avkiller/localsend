name: build with windows for avkiller

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: 'release tags(Default: v1.17.0)'
        required: true
        default: 'v1.17.0'

env:
  FLUTTER_VERSION: "3.41.9"
  RUST_VERSION: "1.84.1"

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_windows_zip_x86_64:
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    env:
          VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ inputs.version }}

    steps:
      - name: Fix long file paths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Install Rust (Modern Toolchain)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: x86_64-pc-windows-msvc
      - name: Check rust-toolchain.toml
        working-directory: packages/localsend_isolates
        run: rustup show

      - name: Enable Long Paths
        run: Set-ItemProperty -Path HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem -Name LongPathsEnabled -Value 1

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: List Windows Directory Files
        shell: pwsh
        run: |
          Write-Host "--- Checking app/windows directory ---"
          Get-ChildItem -Path app/windows | Select-Object Name
    
          Write-Host "`n--- Checking app/windows/runner directory ---"
          if (Test-Path "app/windows/runner") {
            Get-ChildItem -Path app/windows/runner | Select-Object Name
          }
          
      - name: Fix Rust Build Paths
        if: false
        shell: powershell
        run: |
           $targetDir = "D:\a\localsend\localsend\app\windows\flutter\ephemeral\rust"
           if (!(Test-Path $targetDir)) {
             New-Item -ItemType Directory -Force -Path $targetDir
           }
    
           Copy-Item -Path "packages/localsend_isolates/rust/*" -Destination $targetDir -Recurse -Force

      - name: Compile for Windows
        working-directory: app
        env:
          FLUTTER_ROOT: ${{ env.FLUTTER_ROOT }} 
          CARGOKIT_TOOL_TEMP_DIR: ${{ github.workspace }}\build\cargokit_temp
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\build\cargokit_temp"
          flutter build windows -v


      - name: Create empty settings.json
        working-directory: app
        run: echo {} > build/windows/x64/runner/Release/settings.json

      - name: Add DLL files
        working-directory: app
        run: | 
          Copy-Item ../support/build/windows/x64/msvcp140.dll build/windows/x64/runner/Release/
          Copy-Item ../support/build/windows/x64/vcruntime140.dll build/windows/x64/runner/Release/
          Copy-Item ../support/build/windows/x64/vcruntime140_1.dll build/windows/x64/runner/Release/

      # - name: Setup Dart SDK (for CLI compilation)
      #   uses: dart-lang/setup-dart@v1
      #   with:
      #     sdk: stable

      # - name: Dependencies for CLI
      #   working-directory: cli
      #   run: dart pub get

      # - name: Compile CLI for Windows
      #   working-directory: cli
      #   run: |
      #     mkdir build
      #     dart compile exe bin/cli.dart -o build/localsend-cli.exe

      # - name: Copy CLI to GUI Release folder
      #   working-directory: app
      #   run: |
      #     # 创建 cli 子文件夹（可选，保持整洁）
      #     New-Item -ItemType Directory -Force -Path build/windows/x64/runner/Release/cli
      #     # 复制 CLI 可执行文件到 Release 目录
      #     Copy-Item ../cli/build/localsend-cli.exe build/windows/x64/runner/Release/cli/

      - name: Zip compiled files
        working-directory: app
        run: |
          # Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath LocalSend.zip
          # 设置变量
          $buildDir = "build/windows/x64/runner/Release"

          # 检查目录是否存在
          if (Test-Path $buildDir) {
            Write-Host "Cleaning up unnecessary files from $buildDir..."
              
            # 删除 .lib 和 .exp 文件
            $filesToDelete = Get-ChildItem -Path $buildDir -Include *.lib,*.exp -Recurse
            if ($filesToDelete.Count -gt 0) {
              Write-Host "Deleting $($filesToDelete.Count) files..."
              $filesToDelete | Remove-Item -Force
              Write-Host "Deleted successfully."
            } else {
                Write-Host "No .lib or .exp files found."
            }
              
            # 创建 ZIP 文件
            Write-Host "Creating LocalSend.zip..."
            Compress-Archive -Path "$buildDir\*" -DestinationPath "LocalSend.zip" -Force
            Write-Host "LocalSend.zip created successfully."
          } else {
              Write-Error "Directory not found: $buildDir"
          }


      - name: Upload zip
        uses: actions/upload-artifact@v6
        with:
          name: windows-zip-x86-64-result
          path: app/LocalSend.zip
          
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: |
            app/LocalSend.zip
          draft: true
          target_commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN}}

      
