name: build with windows for avkiller

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: 'release tags(Default: v1.17.0)'
        required: true
        default: 'v1.17.0'

env:
  FLUTTER_VERSION: "3.38.10"
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_windows_zip_x86_64:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    env:
          VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ inputs.version }}

    steps:
      - name: Fix long file paths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
      - name: Enable Long Paths
        run: Set-ItemProperty -Path HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem -Name LongPathsEnabled -Value 1

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: List Windows Directory Files
        shell: pwsh
        run: |
          Write-Host "--- Checking app/windows directory ---"
          Get-ChildItem -Path app/windows | Select-Object Name
    
          Write-Host "`n--- Checking app/windows/runner directory ---"
          if (Test-Path "app/windows/runner") {
            Get-ChildItem -Path app/windows/runner | Select-Object Name
          }

      - name: Compile for Windows
        working-directory: app
        run: flutter build windows -v

      - name: Create empty settings.json
        working-directory: app
        run: echo {} > build/windows/x64/runner/Release/settings.json

      - name: Add DLL files
        working-directory: app
        run: |
          Copy-Item ../scripts/windows/x64/msvcp140.dll build/windows/x64/runner/Release/
          Copy-Item ../scripts/windows/x64/vcruntime140.dll build/windows/x64/runner/Release/
          Copy-Item ../scripts/windows/x64/vcruntime140_1.dll build/windows/x64/runner/Release/

      - name: Setup Dart SDK (for CLI compilation)
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Dependencies for CLI
        working-directory: cli
        run: dart pub get

      - name: Compile CLI for Windows
        working-directory: cli
        run: |
          mkdir build
          dart compile exe bin/cli.dart -o build/localsend-cli.exe

      - name: Copy CLI to GUI Release folder
        working-directory: app
        run: |
          # 创建 cli 子文件夹（可选，保持整洁）
          New-Item -ItemType Directory -Force -Path build/windows/x64/runner/Release/cli
          # 复制 CLI 可执行文件到 Release 目录
          Copy-Item ../cli/build/localsend-cli.exe build/windows/x64/runner/Release/cli/

      - name: Zip compiled files
        working-directory: app
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath LocalSend.zip

      - name: Upload zip
        uses: actions/upload-artifact@v6
        with:
          name: windows-zip-x86-64-result
          path: app/LocalSend.zip
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: |
            app/LocalSend.zip
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN}}

      
